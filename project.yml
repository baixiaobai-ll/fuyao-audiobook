name: 扶摇
options:
  bundleIdPrefix: com.fuyao
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: zh-Hans

settings:
  SWIFT_VERSION: "5"
  IPHONEOS_DEPLOYMENT_TARGET: "16.0"

targets:
  扶摇:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Sources
        excludes:
          - "使用示例.swift"
      - path: Sources/Bookshelf
    resources:
      - path: Resources
      - path: App/Assets.xcassets
      - path: Config.plist
      - path: Vendor/NumberAuthSDK/Resources/ATAuthSDK.bundle
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: AVFoundation.framework
      - sdk: Foundation.framework
      - sdk: Network.framework
      - sdk: WebKit.framework
      - sdk: MediaPlayer.framework
      - framework: Vendor/NumberAuthSDK/ATAuthSDK.xcframework
      - framework: Vendor/NumberAuthSDK/YTXOperators.xcframework
      - framework: Vendor/NumberAuthSDK/YTXMonitor.xcframework
      - target: 扶摇WidgetExtension
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 扶摇
        CFBundleURLTypes:
          - CFBundleURLName: com.fuyao.audiobook
            CFBundleURLSchemes:
              - fuyao
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSSupportsLiveActivities: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.fuyao.audiobook
      INFOPLIST_FILE: App/Info.plist
      SWIFT_VERSION: "5"
      OTHER_LDFLAGS:
        - "$(inherited)"
        - "-ObjC"
      TARGETED_DEVICE_FAMILY: "1,2"
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: ""
      IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    attributes:
      SystemCapabilities:
        com.apple.BackgroundModes:
          enabled: 1

  扶摇WidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: Widgets
      - path: Sources/LiveActivity
    resources:
      - path: App/Assets.xcassets
      - path: Widgets/FuyaoWidgetAssets.xcassets
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: 扶摇小组件
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.fuyao.audiobook.widget
      INFOPLIST_FILE: Widgets/Info.plist
      IPHONEOS_DEPLOYMENT_TARGET: "16.1"
      SKIP_INSTALL: YES
