name: 扶摇
options:
  bundleIdPrefix: com.fuyao
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: zh-Hans

settings:
  SWIFT_VERSION: "5"
  IPHONEOS_DEPLOYMENT_TARGET: "16.0"

targets:
  扶摇:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Sources
        excludes:
          - "使用示例.swift"
      - path: Sources/Bookshelf
    resources:
      - path: Resources
      - path: App/Assets.xcassets
      - path: Config.plist
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: AVFoundation.framework
      - sdk: Foundation.framework
      - sdk: Network.framework
      - sdk: WebKit.framework
      - sdk: MediaPlayer.framework
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 扶摇FM
        CFBundleURLTypes:
          - CFBundleURLName: com.fuyao.audiobook
            CFBundleURLSchemes:
              - fuyao
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.fuyao.audiobook
      INFOPLIST_FILE: App/Info.plist
      SWIFT_VERSION: "5"
      OTHER_LDFLAGS:
        - "$(inherited)"
        - "-ObjC"
      TARGETED_DEVICE_FAMILY: "1,2"
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: ""
      IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    attributes:
      SystemCapabilities:
        com.apple.BackgroundModes:
          enabled: 1

# 显式声明共享 scheme，避免 xcodegen 重生成后没有合适的 user scheme，
# 导致 Xcode 顶部找不到主 App 可执行入口。
schemes:
  扶摇:
    build:
      targets:
        扶摇: all
    run:
      config: Debug
      executable: 扶摇
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
